<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오리온자리와 천구 투영 시뮬레이션</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #030712;
            color: #f3f4f6;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 select-none">

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- UI Overlay Header -->
    <div class="absolute top-4 left-4 z-10 bg-gray-900/85 backdrop-blur-md p-4 rounded-2xl border border-gray-800 shadow-2xl max-w-sm pointer-events-auto">
        <h1 class="text-xl font-bold bg-gradient-to-r from-amber-400 to-sky-400 bg-clip-text text-transparent">오리온자리 천구 투영 시뮬레이션</h1>
        <p class="text-xs text-gray-400 mt-1 leading-relaxed">
            초기에는 천구 상에 투영된 작고 밝은 노란색 오리온자리 별들이 표시됩니다. 버튼을 눌러 3차원 공간 속 실제 별들과 투영선을 확인해보세요.
        </p>
    </div>

    <!-- Control Panel -->
    <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 z-10 bg-gray-900/90 backdrop-blur-md px-6 py-3.5 rounded-2xl border border-gray-800 shadow-2xl flex flex-wrap items-center justify-center gap-3 pointer-events-auto">
        <button id="toggle-space-elements" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 active:scale-95 transition-all rounded-xl font-medium text-xs sm:text-sm shadow-lg shadow-indigo-500/30 flex items-center gap-2 text-white">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            <span id="btn-space-text">실제 별 & 투영선 표시 (OFF)</span>
        </button>
        <button id="align-orion" class="px-4 py-2.5 bg-amber-600 hover:bg-amber-500 active:scale-95 transition-all rounded-xl font-medium text-xs sm:text-sm shadow-lg shadow-amber-500/30 text-white flex items-center gap-2">
            ✨ 오리온자리 정면 시점 보기
        </button>
        <button id="reset-camera" class="px-3.5 py-2.5 bg-gray-800 hover:bg-gray-700 active:scale-95 transition-all rounded-xl font-medium text-xs sm:text-sm text-gray-300">
            초기화
        </button>
    </div>

    <!-- Legend Panel -->
    <div class="absolute top-4 right-4 z-10 bg-gray-900/85 backdrop-blur-md p-4 rounded-2xl border border-gray-800 shadow-2xl text-xs space-y-2 pointer-events-auto hidden sm:block">
        <div class="font-bold text-gray-300 mb-1">오리온 7성 및 범례</div>
        <div id="legend-space-group" class="hidden space-y-2">
            <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span> 중앙의 아주 작은 지구</div>
            <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-slate-300 inline-block"></span> 3D 공간 속 오리온 별 (옅은 색)</div>
            <div class="flex items-center gap-2"><span class="w-3.5 h-1 bg-sky-400 inline-block"></span> 투영선 (지구 ➔ 별 ➔ 천구)</div>
        </div>
        <div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-yellow-400 inline-block"></span> 천구 상에 투영된 별 (노란색)</div>
        <div class="text-gray-400 mt-2 pt-2 border-t border-gray-800">🖱️ 드래그: 뷰 회전<br>📜 스크롤: 줌 인/아웃</div>
    </div>

    <!-- Application Script -->
    <script>
        let scene, camera, renderer, celestialSphere;
        let spaceStarsGroup, celestialProjectionsGroup, earthRaysGroup, tinyEarthMesh;
        
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraAngleX = 0.4;
        let cameraAngleY = 1.1;
        let cameraRadius = 24;

        let showSpaceElements = false; // 초기에는 숨김 (천구 상 노란색 투영 별만 표시)
        const SPHERE_RADIUS = 12;

        // Orion 7 stars data
        const orionStarsData = [
            { 
                name: "베텔기우스 (Betelgeuse)", 
                dir: [-0.45, 0.55, -0.70], 
                distance: 7.2, 
                spaceColor: 0xd1d5db, 
                projColor: 0xfacc15,  
                size: 0.32 
            },
            { 
                name: "벨라트릭스 (Bellatrix)", 
                dir: [0.45, 0.58, -0.68], 
                distance: 10.0, 
                spaceColor: 0xd1d5db, 
                projColor: 0xfacc15, 
                size: 0.28 
            },
            { 
                name: "리겔 (Rigel)", 
                dir: [0.42, -0.52, -0.74], 
                distance: 8.5, 
                spaceColor: 0xd1d5db, 
                projColor: 0xfacc15, 
                size: 0.30 
            },
            { 
                name: "사이프 (Saiph)", 
                dir: [-0.42, -0.48, -0.77], 
                distance: 11.2, 
                spaceColor: 0xd1d5db, 
                projColor: 0xfacc15, 
                size: 0.26 
            },
            { 
                name: "알니탁 (Alnitak)", 
                dir: [-0.08, 0.03, -0.80], 
                distance: 6.8, 
                spaceColor: 0xd1d5db, 
                projColor: 0xfacc15, 
                size: 0.25 
            },
            { 
                name: "알닐람 (Alnilam)", 
                dir: [0.00, 0.07, -0.79], 
                distance: 10.5, 
                spaceColor: 0xd1d5db, 
                projColor: 0xfacc15, 
                size: 0.26 
            },
            { 
                name: "민타카 (Mintaka)", 
                dir: [0.08, 0.11, -0.78], 
                distance: 9.0, 
                spaceColor: 0xd1d5db, 
                projColor: 0xfacc15, 
                size: 0.25 
            }
        ];

        function init() {
            const container = document.getElementById('canvas-container');

            // 1. Scene setup
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030712, 0.012);

            // 2. Camera setup
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            updateCameraPosition();

            // 3. Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // 4. Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);
            const pointLight = new THREE.PointLight(0xffffff, 1.5, 100);
            pointLight.position.set(20, 30, 20);
            scene.add(pointLight);

            // 5. Build Elements
            createBackgroundStars();
            createCelestialSphere();
            createTinyGreenEarth();
            createOrionAndProjections();

            // 초기 상태 반영 (공간 요소들 숨김)
            updateVisibility();

            // 6. Event Listeners for Camera Rotation & Zoom
            window.addEventListener('resize', onWindowResize);
            
            const canvas = renderer.domElement;
            canvas.addEventListener('mousedown', (e) => {
                isDragging = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            canvas.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;

                cameraAngleX -= deltaX * 0.008;
                cameraAngleY = Math.max(0.05, Math.min(Math.PI - 0.05, cameraAngleY - deltaY * 0.008));

                updateCameraPosition();
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('mouseup', () => { isDragging = false; });

            canvas.addEventListener('wheel', (e) => {
                cameraRadius = Math.max(8, Math.min(40, cameraRadius + e.deltaY * 0.03));
                updateCameraPosition();
            });

            // Touch events for mobile
            canvas.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isDragging = true;
                    previousMousePosition = { x: e.touches.length > 0 ? e.touches[0].clientX : 0, y: e.touches.length > 0 ? e.touches[0].clientY : 0 };
                }
            });

            canvas.addEventListener('touchmove', (e) => {
                if (!isDragging || e.touches.length !== 1) return;
                const deltaX = e.touches[0].clientX - previousMousePosition.x;
                const deltaY = e.touches[0].clientY - previousMousePosition.y;

                cameraAngleX -= deltaX * 0.008;
                cameraAngleY = Math.max(0.05, Math.min(Math.PI - 0.05, cameraAngleY - deltaY * 0.008));

                updateCameraPosition();
                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            });

            canvas.addEventListener('touchend', () => { isDragging = false; });

            // UI Button Event Listeners
            document.getElementById('toggle-space-elements').addEventListener('click', () => {
                showSpaceElements = !showSpaceElements;
                updateVisibility();
            });

            document.getElementById('align-orion').addEventListener('click', () => {
                cameraAngleX = Math.PI + 0.15;
                cameraAngleY = Math.PI / 2 - 0.05;
                cameraRadius = 22;
                updateCameraPosition();
            });

            document.getElementById('reset-camera').addEventListener('click', () => {
                cameraAngleX = 0.4;
                cameraAngleY = 1.1;
                cameraRadius = 24;
                showSpaceElements = false; // 초기화 시 꺼진 상태로
                updateVisibility();
                updateCameraPosition();
            });

            animate();
        }

        function updateVisibility() {
            if (spaceStarsGroup) spaceStarsGroup.visible = showSpaceElements;
            if (earthRaysGroup) earthRaysGroup.visible = showSpaceElements;
            if (tinyEarthMesh) tinyEarthMesh.visible = showSpaceElements;

            document.getElementById('btn-space-text').innerText = showSpaceElements ? "실제 별 & 투영선 숨기기 (ON)" : "실제 별 & 투영선 표시 (OFF)";
            
            const legendSpaceGroup = document.getElementById('legend-space-group');
            if (showSpaceElements) {
                legendSpaceGroup.classList.remove('hidden');
            } else {
                legendSpaceGroup.classList.add('hidden');
            }
        }

        function updateCameraPosition() {
            camera.position.x = cameraRadius * Math.sin(cameraAngleY) * Math.sin(cameraAngleX);
            camera.position.y = cameraRadius * Math.cos(cameraAngleY);
            camera.position.z = cameraRadius * Math.sin(cameraAngleY) * Math.cos(cameraAngleX);
            camera.lookAt(0, 0, 0);
        }

        // Ambient background distant stars
        function createBackgroundStars() {
            const bgStarsGeometry = new THREE.BufferGeometry();
            const count = 400;
            const positions = new Float32Array(count * 3);
            for (let i = 0; i < count * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 160;
                positions[i+1] = (Math.random() - 0.5) * 160;
                positions[i+2] = (Math.random() - 0.5) * 160;
            }
            bgStarsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const bgStarsMaterial = new THREE.PointsMaterial({ color: 0x475569, size: 0.5, transparent: true, opacity: 0.4 });
            const bgStars = new THREE.Points(bgStarsGeometry, bgStarsMaterial);
            scene.add(bgStars);
        }

        // 천구(Celestial Sphere)
        function createCelestialSphere() {
            const geometry = new THREE.SphereGeometry(SPHERE_RADIUS, 32, 32);
            const material = new THREE.MeshBasicMaterial({
                color: 0x00f2fe,
                wireframe: true,
                transparent: true,
                opacity: 0.04
            });
            celestialSphere = new THREE.Mesh(geometry, material);
            scene.add(celestialSphere);

            const gridGroup = new THREE.Group();
            const gridMaterial = new THREE.LineBasicMaterial({
                color: 0x38bdf8,
                transparent: true,
                opacity: 0.06
            });

            // 적위선 (위도선)
            const latitudes = [-Math.PI/3, -Math.PI/6, 0, Math.PI/6, Math.PI/3];
            latitudes.forEach(lat => {
                const r = SPHERE_RADIUS * Math.cos(lat);
                const y = SPHERE_RADIUS * Math.sin(lat);
                const points = [];
                const segments = 48;
                for (let i = 0; i <= segments; i++) {
                    const theta = (i / segments) * Math.PI * 2;
                    points.push(new THREE.Vector3(r * Math.cos(theta), y, r * Math.sin(theta)));
                }
                const latGeo = new THREE.BufferGeometry().setFromPoints(points);
                const latLine = new THREE.Line(latGeo, gridMaterial);
                gridGroup.add(latLine);
            });

            // 적경선 (경도선)
            const meridiansCount = 8;
            for (let i = 0; i < meridiansCount; i++) {
                const phi = (i / meridiansCount) * Math.PI * 2;
                const points = [];
                const segments = 48;
                for (let j = 0; j <= segments; j++) {
                    const theta = (j / segments) * Math.PI;
                    const x = SPHERE_RADIUS * Math.sin(theta) * Math.cos(phi);
                    const y = SPHERE_RADIUS * Math.cos(theta);
                    const z = SPHERE_RADIUS * Math.sin(theta) * Math.sin(phi);
                    points.push(new THREE.Vector3(x, y, z));
                }
                const merGeo = new THREE.BufferGeometry().setFromPoints(points);
                const merLine = new THREE.Line(merGeo, gridMaterial);
                gridGroup.add(merLine);
            }

            scene.add(gridGroup);

            // Equator ring
            const ringGeo = new THREE.RingGeometry(SPHERE_RADIUS * 1.01, SPHERE_RADIUS * 1.02, 64);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide, transparent: true, opacity: 0.1 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2;
            scene.add(ring);
        }

        // 중앙의 지구: 실제 별 크기와 같은 아주 작은 초록색 점/구체
        function createTinyGreenEarth() {
            const earthGeo = new THREE.SphereGeometry(0.22, 16, 16);
            const earthMat = new THREE.MeshBasicMaterial({ color: 0x10b981 });
            tinyEarthMesh = new THREE.Mesh(earthGeo, earthMat);
            tinyEarthMesh.position.set(0, 0, 0);
            scene.add(tinyEarthMesh);
        }

        // 오리온 7개 별과 천구 표면 투영 별 및 점선
        function createOrionAndProjections() {
            spaceStarsGroup = new THREE.Group();
            celestialProjectionsGroup = new THREE.Group();
            earthRaysGroup = new THREE.Group();

            const earthCenter = new THREE.Vector3(0, 0, 0);

            orionStarsData.forEach(data => {
                const dir = new THREE.Vector3(...data.dir).normalize();
                const spacePos = dir.clone().multiplyScalar(data.distance);

                // 1. 3D 공간 상의 실제 별 (균일한 옅은 색상)
                const starGeo = new THREE.SphereGeometry(data.size, 16, 16);
                const starMat = new THREE.MeshBasicMaterial({ color: data.spaceColor });
                const starMesh = new THREE.Mesh(starGeo, starMat);
                starMesh.position.copy(spacePos);
                spaceStarsGroup.add(starMesh);

                // 2. 천구 표면에서의 투영 위치
                const projectionPos = dir.clone().multiplyScalar(SPHERE_RADIUS);

                // 3. 천구 표면에 맺힌 투영된 별 (작고 선명한 노란색) -> 크기 축소 (0.22)
                const projGeo = new THREE.SphereGeometry(0.22, 16, 16);
                const projMat = new THREE.MeshBasicMaterial({
                    color: data.projColor,
                    transparent: true,
                    opacity: 0.95
                });
                const projMesh = new THREE.Mesh(projGeo, projMat);
                projMesh.position.copy(projectionPos);
                celestialProjectionsGroup.add(projMesh);

                // 투영된 별 주변의 은은한 노란색 글로우
                const glowGeo = new THREE.RingGeometry(0.22, 0.4, 16);
                const glowMat = new THREE.MeshBasicMaterial({
                    color: data.projColor,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.4
                });
                const glowMesh = new THREE.Mesh(glowGeo, glowMat);
                glowMesh.position.copy(projectionPos);
                glowMesh.lookAt(earthCenter);
                celestialProjectionsGroup.add(glowMesh);

                // 4. 지구 -> 3D 별 -> 천구를 잇는 점선 (투영선)
                const points = [earthCenter, projectionPos];
                const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
                const lineMat = new THREE.LineDashedMaterial({
                    color: 0x38bdf8,
                    dashSize: 0.35,
                    gapSize: 0.2,
                    transparent: true,
                    opacity: 0.65
                });
                const rayLine = new THREE.Line(lineGeo, lineMat);
                rayLine.computeLineDistances();
                earthRaysGroup.add(rayLine);
            });

            scene.add(spaceStarsGroup);
            scene.add(celestialProjectionsGroup);
            scene.add(earthRaysGroup);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
